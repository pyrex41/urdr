name: strict-semantic-conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  four-port-kernel-41-2:
    name: Bifrost go/lua/cl/rust kernel 41.2
    runs-on: ubuntu-24.04
    # The source lane is minutes; the shake lane adds ~50 (stage-2 compilation,
    # not execution -- one rustc on the largest bundle is ~10 by itself).
    timeout-minutes: 150
    steps:
      - name: Check out Urdr
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install host runtimes for pinned ports
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit sbcl

      - name: Bootstrap and build exact dependency commits
        run: |
          set -eu
          make bootstrap
          deps="$GITHUB_WORKSPACE/.cache/urdr/dependencies"
          mkdir -p "$deps/shen-go/.bin"
          go build -C "$deps/shen-go" -o "$deps/shen-go/.bin/shen-go" ./cmd/shen
          cargo build --manifest-path "$deps/shen-rust/Cargo.toml" \
            --locked --release --bin shen-rust
          "$deps/shen-lua/bin/shen" -e '(version)'
          # shen-cl master builds from Tarver's restructured S41.2 (2026-07-11),
          # not the community ShenOSKernel-41.2 that `make fetch` downloads.
          # The assembler builds the documented hybrid: 14 Tarver KLambda files
          # + the three community extension-*.kl shen-cl still needs + Tarver's
          # StLib sources. Using `fetch` here yields the community kernel, and
          # master's boot never loads init.kl, so the build dies with an
          # unbound *property-vector*.
          #
          # Feed it the pinned mirror tag rather than letting it reach
          # shenlanguage.org: Tarver re-uploads S41.2.zip in place, so that URL
          # changes content without changing the version string and the
          # assembler only warns on a sha mismatch. The community half stays a
          # download because it is an immutable GitHub release asset.
          git clone --depth 1 --branch s41.2-pristine-20260711 \
            https://github.com/pyrex41/shen-upstream.git "$RUNNER_TEMP/tarver"
          ( cd "$deps/shen-cl" \
            && scripts/assemble-tarver-kernel.sh "$RUNNER_TEMP/tarver" )
          make -C "$deps/shen-cl" precompile \
            SHEN="$deps/shen-go/.bin/shen-go"
          make -C "$deps/shen-cl" build-sbcl
          # Stage-1 shaker for the shake lane. The gate points Ratatoskr at
          # this binary and at the pinned port checkouts, so the lane attests
          # to the reviewed commits rather than to whatever is on PATH.
          go build -C "$deps/ratatoskr" -o "$deps/ratatoskr/ratatoskr" .

      - name: Run dependency-free offline checks
        env:
          CARGO_NET_OFFLINE: "true"
        run: make quality

      - name: Run clean offline conformance and emit evidence
        env:
          URDR_OFFLINE: "1"
          REQUIRED_IMPLS: shen-go,shen-lua,shen-cl,shen-rust
          CARGO_NET_OFFLINE: "true"
        run: |
          set +e
          python3 scripts/check-clean-tree -- sh -c \
            'python3 scripts/conformance > "$RUNNER_TEMP/bifrost-evidence.json"'
          rc=$?
          python3 -m json.tool "$RUNNER_TEMP/bifrost-evidence.json"
          exit "$rc"

      # Deliberately not on pull_request: the shake lane costs ~50 minutes and
      # would land on every push to every PR. The source lane above still gates
      # every PR. Drop this condition if the deploy artifacts should be gated
      # per-PR too, and expect the wall clock.
      - name: Run the shake lane and emit evidence
        if: github.event_name != 'pull_request'
        env:
          URDR_OFFLINE: "1"
          URDR_SHAKE: "1"
          REQUIRED_IMPLS: shen-go,shen-lua,shen-cl,shen-rust
          CARGO_NET_OFFLINE: "true"
        run: |
          set +e
          python3 scripts/check-clean-tree -- sh -c \
            'python3 scripts/conformance > "$RUNNER_TEMP/shake-evidence.json"'
          rc=$?
          python3 -m json.tool "$RUNNER_TEMP/shake-evidence.json"
          exit "$rc"
