name: strict-semantic-conformance

on:
  pull_request:
  push:
    branches:
      - main
  # Nightly: the full four-target shake matrix, including shen-rust.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  four-port-kernel-41-2:
    name: Bifrost go/lua/cl/rust kernel 41.2
    runs-on: ubuntu-24.04
    # PR/push runs are ~10 minutes; the nightly full-matrix shake needs far
    # more, because shen-rust's stage-2 build dominates it.
    timeout-minutes: 180
    steps:
      - name: Check out Urdr
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install host runtimes for pinned ports
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit sbcl

      - name: Bootstrap and build exact dependency commits
        run: |
          set -eu
          make bootstrap
          # The build lives in scripts/build-ports, not inline here. It used to
          # be inline, which meant `make bootstrap && make conformance` locally
          # never rebuilt anything: bootstrap updates sources in place and
          # leaves build output alone, so a launcher built before a repin
          # survived it and the gate ran code that was not the reviewed commit.
          # build-ports also stamps each launcher with the commit it came from,
          # and the gate refuses a stamp that does not match the pin.
          #
          # Feed shen-cl the pinned mirror tag rather than letting it reach
          # shenlanguage.org: Tarver re-uploads S41.2.zip in place, so that URL
          # changes content without changing the version string and the
          # assembler only warns on a sha mismatch.
          git clone --depth 1 --branch s41.2-pristine-20260711 \
            https://github.com/pyrex41/shen-upstream.git "$RUNNER_TEMP/tarver"
          URDR_TARVER_MIRROR="$RUNNER_TEMP/tarver" make ports

      - name: Run dependency-free offline checks
        env:
          CARGO_NET_OFFLINE: "true"
        run: make quality

      - name: Run clean offline conformance and emit evidence
        env:
          URDR_OFFLINE: "1"
          REQUIRED_IMPLS: shen-go,shen-lua,shen-cl,shen-rust
          CARGO_NET_OFFLINE: "true"
        run: |
          set +e
          python3 scripts/check-clean-tree -- sh -c \
            'python3 scripts/conformance > "$RUNNER_TEMP/bifrost-evidence.json"'
          rc=$?
          python3 -m json.tool "$RUNNER_TEMP/bifrost-evidence.json"
          exit "$rc"

      # Gates every PR: 12 cases across go/lua/shen-cl in ~5 minutes. shen-rust
      # is excluded here and covered nightly below -- its stage-2 build is ~88%
      # of a four-target run (169s per case, still ~98s warm, because the cost
      # is compiling the generated crate rather than its dependencies), which
      # would take this lane from 5 minutes to 52.
      - name: Run the shake lane and emit evidence
        env:
          URDR_OFFLINE: "1"
          URDR_SHAKE: "1"
          REQUIRED_IMPLS: shen-go,shen-lua,shen-cl
          CARGO_NET_OFFLINE: "true"
        run: |
          set +e
          python3 scripts/check-clean-tree -- sh -c \
            'python3 scripts/conformance > "$RUNNER_TEMP/shake-evidence.json"'
          rc=$?
          python3 -m json.tool "$RUNNER_TEMP/shake-evidence.json"
          exit "$rc"

      # The target the fast lane leaves out. Nightly and on demand only.
      - name: Run the full four-target shake matrix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          URDR_OFFLINE: "1"
          URDR_SHAKE: "1"
          REQUIRED_IMPLS: shen-go,shen-lua,shen-cl,shen-rust
          CARGO_NET_OFFLINE: "true"
        run: |
          set +e
          python3 scripts/check-clean-tree -- sh -c \
            'python3 scripts/conformance > "$RUNNER_TEMP/shake-full-evidence.json"'
          rc=$?
          python3 -m json.tool "$RUNNER_TEMP/shake-full-evidence.json"
          exit "$rc"
